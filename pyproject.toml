[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warraq-site"
version = "0.1.0"
description = "The Warraq Arabic documentation site: a small static generator with Arabic-aware search"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Khalid Benjelloun" }]
keywords = ["arabic", "documentation", "static-site-generator", "rtl", "digital-library"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Natural Language :: Arabic",
]
dependencies = ["markdown>=3.5", "pyyaml>=6", "jinja2>=3.1"]

[project.urls]
Homepage = "https://github.com/kmbenjel/warraq"
Documentation = "https://warraq.benjelloun.dev/"
Issues = "https://github.com/kmbenjel/warraq/issues"
Changelog = "https://github.com/kmbenjel/warraq/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.6"]
sample = ["pillow>=10"]

[project.scripts]
warraq-site = "warraq_site.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/warraq_site"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
