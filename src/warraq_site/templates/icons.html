{% macro tool_icon(slug, size=40) -%}

{% if slug == "safha" %}
  <rect x="12" y="9" width="24" height="30" rx="2"/><path d="M6 14h6M14 6v6M42 34h-6M34 42v-6"/><path d="M17 17h14M17 22h14M17 27h10"/>

  <path d="M8 24 22 10h16v16L24 40Z"/><circle cx="31" cy="17" r="2.6"/><path d="M17 26l5 5M21 22l5 5"/>
{% elif slug == "turath-match" %}
  <rect x="6" y="10" width="16" height="22" rx="2"/><rect x="26" y="16" width="16" height="22" rx="2"/><path d="M15 36v4h18M33 12V8H15"/><path d="M11 17h6M11 22h6M31 23h6M31 28h6"/>
{% elif slug == "turath-catalog" %}
  <ellipse cx="24" cy="11" rx="14" ry="5"/><path d="M10 11v26c0 2.8 6.3 5 14 5s14-2.2 14-5V11"/><path d="M10 20c0 2.8 6.3 5 14 5s14-2.2 14-5M10 29c0 2.8 6.3 5 14 5s14-2.2 14-5"/>
{% elif slug == "planfs" %}
  <rect x="9" y="7" width="30" height="34" rx="3"/><path d="M15 16h4M15 24h4M15 32h4"/><path d="M24 16h9M24 24h9M24 32h5"/><path d="M33 30l3 3-3 3"/>
{% elif slug == "pocketshelf" %}

{% elif slug == "agent-workbench" %}
  <rect x="5" y="9" width="38" height="28" rx="3"/><path d="M5 16h38"/><path d="M14 27l4 4 8-9"/><path d="M30 25h7M30 30h5"/><path d="M18 42h12"/>
{% else %}
  <circle cx="24" cy="24" r="16"/>
{% endif %}
</svg>

{% elif name == "theme" %}<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
{% elif name == "menu" %}<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>

{% macro mark(size=34) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 64 64" aria-hidden="true" class="mark"><rect width="64" height="64" rx="14" fill="var(--mark-bg)"/><rect x="5" y="5" width="54" height="54" rx="11" fill="none" stroke="var(--ink)" stroke-width="3.5"/><path d="M45 17 24 44l-4 7 7-4 21-27a2.1 2.1 0 0 0-3-3Z" fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linejoin="round"/><path d="M14 48h14" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/></svg>
{%- endmacro %}
