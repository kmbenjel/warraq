[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warraq-site"
version = "0.1.0"
description = "The Warraq Arabic documentation site: a small static generator with Arabic-aware search"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Khalid Benjelloun" }]
dependencies = ["markdown>=3.5", "pyyaml>=6", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.6"]
sample = ["pillow>=10"]

[project.scripts]
warraq-site = "warraq_site.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/warraq_site"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
