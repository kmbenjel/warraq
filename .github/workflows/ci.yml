name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests sample scripts
      - run: ruff format --check src tests sample scripts
      - run: pytest --cov=warraq_site --cov-report=term-missing
      # the tools' pages come from their public repositories, as in the Pages workflow
      - run: warraq-site build --sync --from git --strict
